name: Release

# Windows (x64 portable .zip) build for the ArtCraft launcher. The macOS .dmg is built on a Mac
# and added to the same release (gh release upload), with its line appended to SHA256SUMS.txt.
# Run it from the Actions tab (fill in "release tag" to publish a GitHub release), or push a tag
# such as v1.0.0; a release carries the files and a SHA256SUMS.txt. Builds are unsigned: no Apple or Windows certificates.
# The license key is not built in: the app fetches it from the license panel at run time.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v1.0.0 (empty: build only)"
        type: string
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out craft-fonts
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: 8dcdacd5153e64560d109541a47d806f26f048c0
          path: craft-fonts
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
      - name: Build and package
        shell: pwsh
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
        run: ./packaging/windows/package.ps1 -Arch x64
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/release/wordcraft-*-windows-x64-portable.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: windows
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cd out
          sha256sum * > SHA256SUMS.txt
          gh release create "$TAG" * --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --notes "Builds with the ArtCraft license check. The macOS build is added separately."
