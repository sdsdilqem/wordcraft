[package]
name = "craft-license"
version = "0.1.0"
edition = "2021"
description = "License check shared by the Craft apps and the Creative Cloud launcher"
license = "MIT OR Apache-2.0"

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }

[features]
default = ["dialog"]
# The "License Expired" window (native message box). The launcher only writes the file and leaves it off.
dialog = ["dep:rfd"]

# Only macOS and Windows ship.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
rfd = { version = "0.17", optional = true }
